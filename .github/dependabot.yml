# Dependency updates, weekly, grouped, after a week's cooldown: npm for the root package and for the
# fixtures (which test the latest version of every framework; the fidelity corpus pins its versions
# on purpose), and the GitHub Actions the workflows and local actions use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # esbuild and esbuild-wasm must stay on the same version (the demos compile with both).
      esbuild:
        patterns: ["esbuild", "esbuild-wasm"]
      playwright:
        patterns: ["playwright-core", "@playwright/test"]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/fixtures/*", "/fixtures/react-express-split/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # A fixture's updates together, majors included: a new major is what the fixtures are there to test.
      fixtures:
        patterns: ["*"]
    ignore:
      # Angular's compiler and svelte-check require TypeScript 6 (ADR 0019). The Next.js fixture is on
      # ^7 (ADR 0024), which installs the latest 7.x without an update. A version range, not an update
      # type: the semver-major rule alone let 7 through in a grouped update (#34).
      - dependency-name: typescript
        versions: [">= 7"]
      # The lockfile fixtures (monorepo-workspaces, pnpm-lock-app) pin versions older than their ranges'
      # latest on purpose: the monorepo tests tell a lockfile that is honoured from one that is not by
      # those versions (#110). Only these fixtures depend directly on ms and escape-html.
      - dependency-name: ms
      - dependency-name: escape-html
      # Solid 2: SolidStart (2.2.3, its latest) requires solid-js 1.9 and @solidjs/router < 2, and
      # create-vite's Solid template, which solid-vite follows, is on solid-js 1.9 and vite-plugin-solid 2.
      # The Solid 2 majors fail to install there (#169). Remove these once both are on Solid 2.
      - dependency-name: solid-js
        versions: [">= 2"]
      - dependency-name: "@solidjs/router"
        versions: [">= 2"]
      - dependency-name: "@solidjs/meta"
        versions: [">= 1"]
      - dependency-name: vite-plugin-solid
        versions: [">= 3"]
      # vue-router 5.5.2 breaks Nuxt's server rendering (ReferenceError: __VUE_OPTIONS_API__ is not
      # defined, also in Node with npm): nuxt-app stays on 5.5.1. Later versions come as usual.
      - dependency-name: vue-router
        versions: ["5.5.2"]

  - package-ecosystem: github-actions
    # / is the workflows and the repository's own action (action.yml); the local composite actions pin
    # actions of their own.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
