# Static analysis of the workflows themselves (https://docs.zizmor.sh).
name: Workflows

on:
  push:
    branches: [main]
    paths: [".github/**", "action.yml"]
  pull_request:
    paths: [".github/**", "action.yml"]

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings fail the job and show as annotations (no code scanning upload, so no extra permissions).
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
