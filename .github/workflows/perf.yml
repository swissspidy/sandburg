name: Performance

# Benchmarks the PR against its base branch (scripts/bench.ts) and fails only on a large regression:
# hosted runners are noisy, so the table in the job summary is the signal, and the threshold a guard.
# It also runs the unit tests' timing assertions (SANDBURG_PERF_TESTS), which need a quiet runner.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pages/**'
      - 'scripts/bench.ts'
      - 'test/unit/await-context.test.ts'
      - 'test/unit/host-socket.test.ts'
      - 'package-lock.json'
      - '.github/workflows/perf.yml'
      - '.github/actions/setup-chromium/**'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark against the base branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/setup-chromium
      - run: git fetch --no-tags --depth=1 origin "${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: node scripts/bench.ts --base FETCH_HEAD --head . --fixtures vite-react-counter,next-app-router --modes warm,cold --rounds 3 --summary "$GITHUB_STEP_SUMMARY" --fail-above 0.3
      # The unit tests' timing assertions (SANDBURG_PERF_TESTS), which CI's unit job leaves out: one
      # file at a time, so that no other test shares the runner's cores. After the benchmark, whatever
      # it found, so that neither hides the other's result.
      - if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec --test-concurrency=1 test/unit/await-context.test.ts test/unit/host-socket.test.ts
        env:
          SANDBURG_PERF_TESTS: "1"
