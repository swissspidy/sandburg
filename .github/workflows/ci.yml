name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts it on the "Version packages" branch, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # npm test, with each file's time in the job summary (scripts/test-times.ts).
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout test/unit/*.test.ts

  runtime:
    name: Runtime tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/setup-chromium
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout test/runtime/*.test.ts

  # macOS and Windows: the unit and runtime suites and one end-to-end run, not the whole e2e matrix
  # (ADR 0065). Each suite runs whatever the one before it did, so that one job shows every failure.
  platforms:
    name: ${{ matrix.os == 'macos-latest' && 'macOS' || 'Windows' }} (unit, runtime, e2e run)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: install
        run: npm ci
      - run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout test/unit/*.test.ts
      - id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: $/.github/actions/setup-chromium
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout test/runtime/*.test.ts
      # A test that hangs fails at 5 min (each takes seconds on Linux), with what it was waiting for.
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout --test-concurrency=1 --test-timeout=300000 test/e2e/run.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: platforms-${{ matrix.os }}-runs
          path: |
            .sandburg/runs
            .sandburg/test-runs
          retention-days: 7

  pack:
    name: Package (packed and installed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/setup-chromium
      # npm run test:pack, with each file's time in the job summary.
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout test/pack/*.test.ts

  # The repository's own GitHub Action (action.yml), run from this checkout on a fixture, with the
  # package packed from this commit rather than the npm release the action installs by default.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/sandburg-*.tgz)" >> "$GITHUB_OUTPUT"
      - id: sandburg
        uses: $/
        with:
          project: fixtures/vite-react-counter
          checks: fixtures/vite-react-counter/checks.spec.ts
          args: --checks-in page
          sandburg-version: ${{ steps.pack.outputs.tarball }}
          artifact-name: action-vite-react-counter
      - name: The action's outputs
        run: |
          echo "status=$STATUS result-path=$RESULT_PATH"
          test "$STATUS" = passed
          node -e 'const r = require(require("node:path").resolve(process.argv[1])); if (r.status !== "passed") process.exit(1)' "$RESULT_PATH"
        env:
          STATUS: ${{ steps.sandburg.outputs.status }}
          RESULT_PATH: ${{ steps.sandburg.outputs.result-path }}

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One job per file: each installs its fixtures cold, and the slow ones run side by side.
        suite: [angular, batch, browser-install, frameworks, fullstack, monorepo, node, page-checks, reference, renderer-memory, run, vite-frameworks, websockets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/setup-chromium
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-times.ts --test-reporter-destination=stdout --test-concurrency=1 "test/e2e/${MATRIX_SUITE}.test.ts"
        env:
          MATRIX_SUITE: ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.suite }}-runs
          path: |
            .sandburg/runs
            .sandburg/test-runs
            .sandburg/seeds
          retention-days: 7
