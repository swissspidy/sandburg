# Publishes the package to npm when a version tag (v1.2.3) is pushed, with npm's trusted
# publishing: npm accepts this workflow's OIDC token instead of a stored token, and adds
# provenance (docs/adr/0022-npm-package.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The npm package's trusted publisher names this workflow and environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag against package.json and npm's version
        run: |
          node -e '
            const version = require("./package.json").version;
            if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`tag ${process.env.GITHUB_REF_NAME} is not v${version} (package.json)`);
          '
          # Trusted publishing needs npm 11.5.1 or later.
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) throw new Error(`npm ${process.argv[1]} cannot use trusted publishing (11.5.1 or later)`);
          ' "$npm_version"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack
      # Runs prepack (the dist/ build); trusted publishing adds provenance.
      - run: npm publish
