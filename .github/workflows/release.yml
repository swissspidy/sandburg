# Releases with Changesets and npm's trusted publishing (docs/adr/0022-npm-package.md).
#
# On every push to main:
# 1. version: Changesets keeps a "Version packages" pull request up to date with the pending
#    changesets. Merging it bumps package.json and CHANGELOG.md, and package.json then names a
#    version with no tag yet: that is a release.
# 2. pack (a release only): installs, tests and packs the package. It cannot request an OIDC token.
# 3. publish (a release only): publishes that tarball with the job's OIDC token (npm adds
#    provenance), then tags the version and creates its GitHub release. It installs nothing, so no
#    dependency's install script or test code runs where it could publish.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# Queue rather than cancel: a release stopped halfway may have published without its tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the "Version packages" branch
      pull-requests: write # open and update its pull request
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, and Changesets' history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Changesets needs no install scripts; none run next to the token this job holds.
      - run: npm ci --ignore-scripts
      # Before changesets/action, which leaves the checkout on its version branch with the
      # pending changesets applied: the check has to read main's version, not the next one.
      - name: Is package.json's version unreleased?
        id: release
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the "Version packages" pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # No publish-script: publishing is the publish job's, below.
          version-script: npm run version-packages
          commit-message: "Version packages"
          pr-title: "Version packages"

  pack:
    name: Test and pack
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack
      # Runs prepack (the dist/ build).
      - run: mkdir release && npm pack --pack-destination release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [version, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm package's trusted publisher names this workflow and environment.
    environment: npm
    permissions:
      contents: write # the version's tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # For CHANGELOG.md only: nothing from the checkout is installed or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm's version
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) throw new Error(`npm ${process.argv[1]} cannot use trusted publishing (11.5.1 or later)`);
          ' "$npm_version"
      # A tarball (./: npm would read release/x as a GitHub repository): no install, no lifecycle
      # scripts. Skipped when the version is already on npm, so a run that failed after publishing
      # can be re-run for its tag and release.
      - name: Publish
        run: |
          if npm view "sandburg@$VERSION" version >/dev/null 2>&1; then
            echo "sandburg@$VERSION is already on npm"
          else
            npm publish ./release/*.tgz
          fi
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version's section of CHANGELOG.md, or GitHub's generated notes without one.
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" "${notes[@]}"
