# Builds the demo site (scripts/pages/build.ts) and deploys it to GitHub Pages.
# Repository settings → Pages → Source: "GitHub Actions".
# A pull request that touches the demos or what they run on builds and verifies them, and deploys
# nothing: the build is CI's slowest job, and without this it first ran once the change was merged.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'pages/**'
      - 'src/**'
      - 'scripts/pages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-chromium/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a pull request's run only cancels that pull request's older runs.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the demos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: $/.github/actions/setup-chromium
      # Runs every demo in Sandburg (recording the host's answers), then loads the built site
      # in Chromium and fails if a demo does not come up from static files alone.
      - run: node scripts/pages/build.ts --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: dist-pages/demos/*/screenshot.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only the deploy job publishes; the build runs npm and the repository's code.
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
