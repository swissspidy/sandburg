# Builds the demo site (scripts/pages/build.ts) and deploys it to GitHub Pages.
# Repository settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs every demo in Sandburg (recording the host's answers), then loads the built site
      # in Chromium and fails if a demo does not come up from static files alone.
      - run: node scripts/pages/build.ts --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: dist-pages/demos/*/screenshot.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job publishes; the build runs npm and the repository's code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
