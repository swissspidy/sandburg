<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1><span aria-hidden="true">💸</span> Expense Tracker</h1>
        <div class="summary" aria-live="polite">
          <p class="total" id="total">Total: $0.00</p>
          <ul class="breakdown" id="breakdown" aria-label="Totals by category"></ul>
        </div>
      </header>

      <section class="card" aria-labelledby="add-heading">
        <h2 id="add-heading" class="visually-hidden">Add an expense</h2>
        <form id="expense-form" class="form" novalidate>
          <div class="field grow">
            <label for="description">Description</label>
            <input id="description" name="description" type="text" maxlength="200"
              placeholder="e.g. Groceries" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <div class="money">
              <span aria-hidden="true">$</span>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01"
                inputmode="decimal" placeholder="0.00" required />
            </div>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Other" selected>Other</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Add expense</button>
        </form>
        <p id="error" class="error" role="alert"></p>
      </section>

      <section class="card" aria-labelledby="list-heading">
        <h2 id="list-heading">Expenses</h2>
        <ul id="expenses" class="list" aria-labelledby="list-heading"></ul>
        <p id="empty" class="empty" hidden>No expenses yet. Add your first one above.</p>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
