schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "sandburg/guestbook-nextjs"
description = "App-gen eval task guestbook on Next.js, and its follow-up request, run in Sandburg."
keywords = ["sandburg", "web-app", "nextjs"]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 900.0

[environment]
workdir = "/app"

[[steps]]
name = "request"
min_reward = { passed = 1.0 }

[steps.verifier.env]
CHECKS_TOTAL = "3"

[[steps]]
name = "follow-up"

[steps.verifier.env]
CHECKS_TOTAL = "3"
