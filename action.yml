# Run a project in Sandburg and check it (docs/guide/agents-and-ci.md#github-action):
#
#   - uses: swissspidy/sandburg@<commit sha>
#     with:
#       project: ./my-app
#       checks: ./my-app/checks.spec.ts
#
# It installs the sandburg package from npm, not this checkout: by default the version this ref's
# package.json names. The first release after the action was added is the first tag that has it.
name: Sandburg
description: Run and test a generated web app in the browser with Sandburg.
author: swissspidy
branding:
  icon: check-circle
  color: orange

inputs:
  project:
    description: The project to run (a directory, a .zip, a JSON file tree or snapshot:<id>), relative to the workspace.
    default: "."
  checks:
    description: A checks file (--checks). Empty runs only the built-in checks.
    default: ""
  args:
    description: More options for `sandburg run`, split on whitespace (e.g. "--checks-in page --ready main").
    default: ""
  node-version:
    description: The Node.js version to set up (24 or later).
    default: "24"
  sandburg-version:
    description: >-
      The sandburg package to install: a version, range or dist-tag (0.2.0, ^0.2, latest), the path of a
      packed .tgz (no ":"; starting with ./, ../, / or ~/, or ending in .tgz; relative to the workspace),
      or another npm spec (a URL, file:…), passed to npm as it is. A value starting with - is refused.
      Default: the version in this action ref's package.json.
    default: ""
  allow-chromium-sandbox:
    description: >-
      Lift Ubuntu's AppArmor restriction on unprivileged user namespaces (a sysctl, for the whole host) so
      that Chromium's OS sandbox can start. "false" leaves the host as it is: on a self-hosted runner that
      restricts them, Sandburg then stops and says what to change.
    default: "true"
  artifact-name:
    description: The name of the uploaded artifact with .sandburg/runs. Set it per job in a matrix.
    default: sandburg-runs

outputs:
  status:
    description: The run's status (passed, failed or error); error also when sandburg printed no result.
    value: ${{ steps.run.outputs.status }}
  result-path:
    description: The path of the run's result.json, relative to the workspace (empty when there is none).
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    # Into the runner's temp directory, not the project: the project's own package.json and
    # lockfile stay as they are.
    - id: install
      name: Install sandburg
      shell: bash
      env:
        SANDBURG_SPEC: ${{ inputs.sandburg-version }}
      # Installing the package outside a lockfile is what this step is for.
      run: | # zizmor: ignore[adhoc-packages]
        spec="$SANDBURG_SPEC"
        if [ -z "$spec" ]; then
          spec="$(node -p 'require(process.argv[1]).version' "$GITHUB_ACTION_PATH/package.json")"
        fi
        # A path to a packed .tgz (no ":") is resolved against the workspace; a version, range or
        # dist-tag is the sandburg package's; anything else (a URL, file:…) goes to npm as it is.
        if [[ "$spec" == -* ]]; then
          echo "::error title=sandburg-version::\"$spec\" starts with -: give a version, a path or an npm spec"
          exit 1
        fi
        version='^[-A-Za-z0-9.^~<>=*| ]+$'
        if [[ "$spec" != *:* && ( "$spec" == ./* || "$spec" == ../* || "$spec" == /* || "$spec" == "~/"* || "$spec" == *.tgz ) ]]; then
          spec="${spec/#\~\//$HOME/}"
          spec="$(realpath -m -- "$spec")"
        elif [[ "$spec" =~ $version ]]; then
          spec="sandburg@$spec"
        fi
        prefix="$RUNNER_TEMP/sandburg"
        mkdir -p "$prefix"
        echo '{"private":true}' > "$prefix/package.json"
        # After --, the spec is never taken as an npm option.
        npm install --prefix "$prefix" --no-audit --no-fund -- "$spec"
        # The Chromium cache's key: without it, the package did not install with its dependencies.
        playwright="$(node -p 'require(process.argv[1]).version' "$prefix/node_modules/playwright-core/package.json" 2>/dev/null)" || true
        if [ -z "$playwright" ]; then
          echo "::error title=sandburg-version::$spec installed without playwright-core: give a version, or a packed .tgz (npm pack)"
          exit 1
        fi
        echo "bin=$prefix/node_modules/.bin" >> "$GITHUB_OUTPUT"
        echo "playwright=$playwright" >> "$GITHUB_OUTPUT"

    # Chromium's OS sandbox needs unprivileged user namespaces; Ubuntu 23.10 and later restrict them
    # with AppArmor. Lifting the restriction keeps the sandbox on (docs/guide/troubleshooting.md).
    - name: Allow Chromium's sandbox
      if: runner.os == 'Linux' && inputs.allow-chromium-sandbox == 'true'
      shell: bash
      run: |
        if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ] && command -v sudo >/dev/null; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    # The browsers a Playwright version downloads are fixed by that version: it is the whole key.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: sandburg-ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.install.outputs.playwright }}

    # On a cache hit, `install` downloads nothing. The system libraries (apt) only if Chromium does
    # not start without them: hosted runners have them.
    - name: Install Chromium
      shell: bash
      env:
        SANDBURG_BIN: ${{ steps.install.outputs.bin }}
      run: |
        "$SANDBURG_BIN/playwright-core" install chromium
        if ! (cd "$SANDBURG_BIN/../.." && node -e "require('playwright-core').chromium.launch().then((b) => b.close())"); then
          "$SANDBURG_BIN/playwright-core" install-deps chromium
        fi

    - id: run
      name: sandburg run
      shell: bash
      env:
        SANDBURG_BIN: ${{ steps.install.outputs.bin }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        args=(run "$INPUT_PROJECT" --json --out .sandburg/runs)
        if [ -n "$INPUT_CHECKS" ]; then args+=(--checks "$INPUT_CHECKS"); fi
        # Split on whitespace, without globbing: no quoting inside args.
        set -f
        # shellcheck disable=SC2206
        if [ -n "$INPUT_ARGS" ]; then args+=($INPUT_ARGS); fi
        set +f
        out="$RUNNER_TEMP/sandburg-result.json"
        code=0
        "$SANDBURG_BIN/sandburg" "${args[@]}" > "$out" || code=$?
        node "$GITHUB_ACTION_PATH/scripts/action-result.ts" "$out" "$code"
        exit "$code"

    - name: Upload .sandburg/runs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: .sandburg/runs
        if-no-files-found: ignore
        retention-days: 14
